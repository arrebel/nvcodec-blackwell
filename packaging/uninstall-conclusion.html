<h2>卸载完成</h2>
<p>H.264 现在由系统 / 原厂插件处理。解码与编码服务已重启，安装器留下的辅助文件已清理。</p>

<code>nvrm610.conf.orig</code>，需要时可手动查看。</p>
<p>想重新装上：再运行一次 <code>NVCODEC-Blackwell-1401.pkg</code>，它的 postinstall 会清掉停用标记。</p>
